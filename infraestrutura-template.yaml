AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Exemplo de infraestrutura parametrizada para reutilizacao em ambientes
  Dev, HMG e PRD por meio do AWS CloudFormation Git Sync.

Parameters:
  ProjectName:
    Type: String
    Description: Nome curto do projeto usado na identificacao dos recursos.
    AllowedPattern: '^[a-z0-9-]+$'
    ConstraintDescription: Use apenas letras minusculas, numeros e hifens.

  Environment:
    Type: String
    Description: Ambiente da pilha.
    AllowedValues:
      - dev
      - hmg
      - prd

  VpcCidr:
    Type: String
    Description: Bloco CIDR da VPC.
    AllowedPattern: '^(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'

  PublicSubnetCidr:
    Type: String
    Description: Bloco CIDR da sub-rede publica.

  PrivateSubnetCidr:
    Type: String
    Description: Bloco CIDR da sub-rede privada.

  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Zona de disponibilidade usada pelas sub-redes.

  EnableDnsHostnames:
    Type: String
    Description: Habilita nomes DNS publicos para instancias com IP publico.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: !Ref EnableDnsHostnames
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpc'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-igw'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-subnet'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Network
          Value: public

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-subnet'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Network
          Value: private

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-rt'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-rt'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VpcId:
    Description: ID da VPC criada.
    Value: !Ref VPC

  PublicSubnetId:
    Description: ID da sub-rede publica.
    Value: !Ref PublicSubnet

  PrivateSubnetId:
    Description: ID da sub-rede privada.
    Value: !Ref PrivateSubnet

  Environment:
    Description: Ambiente implantado.
    Value: !Ref Environment
